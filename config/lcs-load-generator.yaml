---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lcs-load-generator-serviceaccount
  namespace: ${LCS_NAMESPACE}
rules:
  - apiGroups: ["extensions", "apps", "batch", "security.openshift.io", "policy"]
    resources: ["deployments", "jobs", "pods", "services", "jobs/status",
                "podsecuritypolicies", "securitycontextconstraints"]
    verbs: ["use", "get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lcs-load-generator-role
  namespace: ${LCS_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lcs-load-generator-serviceaccount
subjects:
  - kind: ServiceAccount
    name: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lcs-load-generator
  namespace: ${LCS_NAMESPACE}
  labels:
    app: lcs-load-generator
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: lcs-load-generator
    spec:
      restartPolicy: Never
      containers:
        - name: lcs-load-generator
          image: ${LCS_LOADGEN_IMAGE}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
            - name: KUBECONFIG
              value: "/etc/kubeconfig/kubeconfig"
            - name: LCS_NAMESPACE
              value: "${LCS_NAMESPACE}"
            - name: LCS_HOST
              value: "${LCS_HOST}"
            - name: LCS_TOKEN
              value: "${LCS_TOKEN}"
            - name: LCS_PROVIDER
              value: "${LCS_PROVIDER}"
            - name: LCS_MODEL
              value: "${LCS_MODEL}"
            - name: LOCUST_USERS
              value: "${LOCUST_USERS}"
            - name: LOCUST_RUN_TIME
              value: "${LOCUST_RUN_TIME}"
            - name: LOCUST_PROCESSES
              value: "${LOCUST_PROCESSES}"
            - name: TEST_UUID
              value: ""
            - name: REQUEST_TIMEOUT
              value: "${REQUEST_TIMEOUT}"
            - name: RESULTS_DIR
              value: "/results"
            - name: QUESTIONS_FILE
              value: "/opt/lcs-load-generator/locust/assets/questions.yaml"
            - name: ES_SERVER
              value: "${ES_SERVER}"
            - name: ES_INDEX
              value: "${ES_INDEX}"
            - name: METRIC_STEP
              value: "${METRIC_STEP}"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: results
              mountPath: /results
            - name: kubeconfig-volume
              mountPath: /etc/kubeconfig
              readOnly: true
          imagePullPolicy: Always
      volumes:
        - name: results
          emptyDir: {}
        - name: kubeconfig-volume
          secret:
            secretName: kubeconfig-secret
